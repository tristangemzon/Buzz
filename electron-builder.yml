appId: com.buzz.app
productName: Buzz
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
# Native modules (better-sqlite3-multiple-ciphers, argon2, keytar) must NOT be
# packed inside the asar archive — they need to be loaded as real .node files.
asarUnpack:
  - "**/node_modules/better-sqlite3-multiple-ciphers/**"
  - "**/node_modules/argon2/**"
  - "**/node_modules/keytar/**"

win:
  # No code-signing cert by default — produce an unsigned .exe. Users will see
  # SmartScreen "unrecognized app" once; click More info → Run anyway. To sign,
  # set certificateFile / certificatePassword (or CSC_LINK / CSC_KEY_PASSWORD
  # env vars) and remove `signAndEditExecutable: false`.
  signAndEditExecutable: false
  target:
    - target: nsis        # Windows installer (.exe)
      arch: [x64, arm64]
    - target: portable    # Single-file portable .exe (no install)
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false                       # show the wizard (lets users pick install dir)
  perMachine: false                     # per-user install → no admin prompt
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Buzz

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.social-networking
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  target: [AppImage, deb]
  category: Network
