appId: com.buzz.app
productName: Buzz
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
# Native modules (better-sqlite3-multiple-ciphers, argon2, keytar) must NOT be
# packed inside the asar archive — they need to be loaded as real .node files.
asarUnpack:
  - "**/node_modules/better-sqlite3-multiple-ciphers/**"
  - "**/node_modules/argon2/**"
  - "**/node_modules/keytar/**"

win:
  # Code-signing is opt-in via env vars (CSC_LINK + CSC_KEY_PASSWORD, or the
  # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD variants). When neither is set the
  # build still succeeds and produces an unsigned .exe — SmartScreen will warn
  # users on first launch (More info → Run anyway). See docs/SIGNING.md.
  signtoolOptions:
    signingHashAlgorithms: [sha256]
  target:
    - target: nsis        # Windows installer (.exe)
      arch: [x64, arm64]
    - target: portable    # Single-file portable .exe (no install)
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false                       # show the wizard (lets users pick install dir)
  perMachine: false                     # per-user install → no admin prompt
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Buzz

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.social-networking
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  target: [AppImage, deb]
  category: Network
